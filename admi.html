<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f9f7a" />
    <title>Download ZopChat</title>
    <style>
      :root {
        --accent: #0f9f7a;
        --accent-dark: #08785d;
        --ink: #10201c;
        --muted: #687772;
        --line: #dce7e2;
        --panel: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
        background:
          radial-gradient(circle at 20% 0%, rgba(15, 159, 122, 0.16), transparent 28rem),
          linear-gradient(145deg, #fbfdfc, #eef6f2);
        color: var(--ink);
      }

      main {
        width: min(100%, 460px);
        display: grid;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: white;
        font-size: 1.7rem;
        font-weight: 900;
        box-shadow: 0 16px 34px rgba(15, 159, 122, 0.28);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 3.4rem);
        line-height: 0.95;
      }

      .card {
        display: grid;
        gap: 18px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(16, 32, 28, 0.12);
      }

      .copy {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .download {
        min-height: 52px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 850;
      }

      .download:active {
        transform: translateY(1px);
      }

      .note {
        padding: 12px;
        border-radius: 12px;
        background: #eef8f4;
        color: var(--accent-dark);
        font-size: 0.9rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark">Z</div>
        <div>
          <h1>ZopChat</h1>
          <p class="copy">Private, simple chats for your circle.</p>
        </div>
      </div>

      <section class="card">
        <p class="copy">
          Join me on ZopChat so we can chat faster, share photos, and stay connected in a clean private chat app.
        </p>

        <!-- Replace this href manually with your final APK / Play Store / website download link. -->
        <a class="download" href="https://example.com/zopchat-download" target="_blank" rel="noopener">Download ZopChat</a>

        <p class="note">Manual link placeholder: edit the Download ZopChat button href in this file when your final app link is ready.</p>
      </section>
    </main>
  </body>
</html>
